    let currentAssignment = 1;
    let userAnswers = {};

    function switchTab(assignmentNum) {
        currentAssignment = assignmentNum;
        
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach((btn, index) => {
            if (index + 1 === assignmentNum) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        renderQuiz();
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';

        const questions = quizData[currentAssignment];
        
        questions.forEach((qObj, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `Q${index + 1}. ${qObj.q}`;
            card.appendChild(title);

            const optionsList = document.createElement('div');
            optionsList.className = 'options-list';

            qObj.options.forEach((opt) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `q_${currentAssignment}_${index}`;
                input.value = opt;

                if (userAnswers[currentAssignment] && userAnswers[currentAssignment][index] === opt) {
                    input.checked = true;
                }

                input.onchange = () => {
                    if (!userAnswers[currentAssignment]) userAnswers[currentAssignment] = {};
                    userAnswers[currentAssignment][index] = opt;
                    updateScoreDisplay();
                };

                label.appendChild(input);
                const span = document.createElement('span');
                span.innerText = opt;
                label.appendChild(span);

                optionsList.appendChild(label);
            });

            card.appendChild(optionsList);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback_${currentAssignment}_${index}`;
            card.appendChild(feedback);

            container.appendChild(card);
        });

        updateScoreDisplay();
    }

    function submitCurrentAssignment() {
        const questions = quizData[currentAssignment];
        let score = 0;

        questions.forEach((qObj, index) => {
            const userAns = userAnswers[currentAssignment] ? userAnswers[currentAssignment][index] : null;
            const feedbackEl = document.getElementById(`feedback_${currentAssignment}_${index}`);

            if (userAns !== null && userAns !== undefined) {
                if (userAns === qObj.answer) {
                    score++;
                    feedbackEl.className = 'feedback correct';
                    feedbackEl.innerText = 'Correct!';
                } else {
                    feedbackEl.className = 'feedback incorrect';
                    feedbackEl.innerText = `Incorrect. Correct Answer: ${qObj.answer}`;
                }
            } else {
                feedbackEl.className = 'feedback incorrect';
                feedbackEl.innerText = `Skipped. Correct Answer: ${qObj.answer}`;
            }
        });

        document.getElementById('scoreDisplay').innerText = `Score: ${score} / ${questions.length} (Submitted)`;

        const congratsBanner = document.getElementById('congratsBanner');
        if (score === questions.length) {
            congratsBanner.style.display = 'block';
        } else {
            congratsBanner.style.display = 'none';
        }
    }

    function updateScoreDisplay() {
        const questions = quizData[currentAssignment];
        let score = 0;
        if (userAnswers[currentAssignment]) {
            questions.forEach((qObj, index) => {
                if (userAnswers[currentAssignment][index] === qObj.answer) {
                    score++;
                }
            });
            document.getElementById('scoreDisplay').innerText = `Score: ${score} / ${questions.length} (Live)`;
        } else {
            document.getElementById('scoreDisplay').innerText = `Score: -- / ${questions.length}`;
        }
        document.getElementById('congratsBanner').style.display = 'none';
    }

    renderQuiz();
</script>
